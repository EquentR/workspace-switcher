name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet dependencies
      run: dotnet restore WorkspaceSwitcher.sln

    - name: Build Solution (Release)
      run: dotnet build WorkspaceSwitcher.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test WorkspaceSwitcher.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Publish CLI Artifact
      run: dotnet publish src/WorkspaceSwitcher.Cli/WorkspaceSwitcher.Cli.csproj --configuration Release -o ./publish-cli

    - name: Upload CLI Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkspaceSwitcher-CLI-Windows
        path: ./publish-cli/
